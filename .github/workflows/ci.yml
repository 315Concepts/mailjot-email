name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Includes engine/contract.test.ts, which fails the build if any template or transport breaks its contract.
      - run: npm test
      - run: npm run engine-compiler
      - run: npm run template-compiler
      - run: npm run transport-compiler

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: engine
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
